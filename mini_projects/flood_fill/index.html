<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Fill Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>DFS Flood Fill</h1>

      <div class="controls">
        <label for="colorPicker">New Color:</label>
        <input type="color" id="colorPicker" value="#3498db" />
        <button id="resetBtn">Reset Grid</button>
      </div>

      <div id="grid" role="grid" aria-label="Interactive flood fill grid"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
